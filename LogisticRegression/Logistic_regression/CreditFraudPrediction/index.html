<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credit Risk Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
        }
        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 4px;
        }
        .safe {
            background-color: #e6f4ea;
            color: #0a662e;
        }
        .risk {
            background-color: #fdecea;
            color: #8a1c1c;
        }
        .error {
            margin-top: 20px;
            color: red;
        }
    </style>
</head>
<body>

<h2>Credit Risk Prediction</h2>

<label>Income</label>
<input id="income" type="number" value="60000">

<label>Debt-to-Income Ratio</label>
<input id="dti" type="number" step="0.01" value="0.35">

<label>Credit Utilization</label>
<input id="utilization" type="number" step="0.01" value="0.55">

<label>Late Payments</label>
<input id="late" type="number" value="1">

<label>Loan Amount</label>
<input id="loan" type="number" value="12000">

<label>Employment Length (years)</label>
<input id="employment" type="number" value="6">

<label>Age</label>
<input id="age" type="number" value="38">

<button onclick="predict()">Predict</button>

<div id="output"></div>
<div id="error" class="error"></div>

<script>
async function predict() {
    const output = document.getElementById("output");
    const error = document.getElementById("error");
    output.innerHTML = "";
    error.textContent = "";

    const payload = {
        income: Number(document.getElementById("income").value),
        debt_to_income_ratio: Number(document.getElementById("dti").value),
        credit_utilization: Number(document.getElementById("utilization").value),
        late_payments: Number(document.getElementById("late").value),
        loan_amount: Number(document.getElementById("loan").value),
        employment_length: Number(document.getElementById("employment").value),
        age: Number(document.getElementById("age").value)
    };

    try {
        const response = await fetch("http://localhost:8000/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Prediction failed");
        }

        const div = document.createElement("div");
        div.className = "result " + (data.predicted_label === 1 ? "risk" : "safe");

        div.innerHTML = `
            <strong>Decision:</strong> ${data.decision}<br>
            <strong>Probability of Default:</strong> ${(data.probability_default * 100).toFixed(2)}%
        `;

        output.appendChild(div);
    } catch (err) {
        error.textContent = err.message;
    }
}
</script>

</body>
</html>
